<div
  id="aby-root"
  class="aby-root"
  style="width: 360px; height: 530px;"
>
  <section class="aby-hero">
    <div class="aby-hero-overlay">
      <div class="aby-hero-row">
        <div class="aby-credit-chip">
          <span class="aby-credit-label">Cr</span>
          <span class="aby-credit-value" id="aby-credit">0</span>
        </div>
      </div>
    </div>
  </section>

  <nav class="aby-main-tabs">
    <button class="aby-main-tab active" data-mode="slave">노예 구매</button>
    <button class="aby-main-tab" data-mode="item">아이템 구매</button>
    <button class="aby-main-tab" data-mode="status">상태창</button>
  </nav>

  <section class="aby-main">
    <div class="aby-view active" id="aby-view-slaves">
      <div class="aby-filterbar">
        <div class="aby-tabs" id="aby-tabs"></div>
        <div class="aby-toolbar">
          <button id="aby-sort-btn" class="aby-sort-btn">정렬: 희귀도</button>
        </div>
      </div>

      <div class="aby-card-grid" id="aby-card-grid"></div>

      <div class="aby-pagebar" id="aby-pagebar-slave">
        <button class="aby-page-btn" id="aby-page-prev">◀</button>
        <span class="aby-page-info" id="aby-page-info">1 / 1</span>
        <button class="aby-page-btn" id="aby-page-next">▶</button>
      </div>
    </div>

    <div class="aby-view" id="aby-view-items">
      <div class="aby-item-filterbar">
        <div class="aby-item-tabs">
          <button class="aby-item-tab active" data-itab="common">공통</button>
          <button class="aby-item-tab" data-itab="personal">전용</button>
        </div>

        <div class="aby-item-tools">
          <select id="aby-item-owner-filter" class="aby-item-owner-filter">
            <option value="all">캐릭터</option>
          </select>

          <button class="aby-sort-btn" id="aby-item-sort-btn">가격 낮은순</button>
        </div>
      </div>

      <div class="aby-item-grid" id="aby-item-grid"></div>

      <div class="aby-pagebar" id="aby-pagebar-item">
        <button class="aby-page-btn" id="aby-item-page-prev">◀</button>
        <span class="aby-page-info" id="aby-item-page-info">1 / 1</span>
        <button class="aby-page-btn" id="aby-item-page-next">▶</button>
      </div>
    </div>

    <div class="aby-view" id="aby-view-status">
      <div class="aby-status-placeholder">
        상태창은 나중에 붙일 자리야.  
        <br />지금은 레이아웃만 잡아 둘게.
      </div>
    </div>
  </section>

  <div class="aby-bottomsheet-backdrop" id="aby-bottomsheet-backdrop"></div>
  <section class="aby-bottomsheet" id="aby-bottomsheet">
    <div class="aby-poster-card">
      <div class="aby-poster-bg" id="aby-poster-bg"></div>
      <div class="aby-poster-gradient"></div>

      <div class="aby-poster-content">
        <header class="aby-poster-header">
          <div class="aby-bs-headerbox">
            <div class="aby-bs-title-row">
              <h2 class="aby-bs-name" id="aby-bs-name">선택된 상품 없음</h2>
              <span class="aby-bs-race" id="aby-bs-race">드래곤</span>
            </div>
            <div class="aby-bs-meta-row">
              <span class="aby-bs-rarity" id="aby-bs-rarity"></span>
              <span class="aby-bs-subtag" id="aby-bs-gender"></span>
              <span class="aby-bs-subtag" id="aby-bs-status"></span>
            </div>
          </div>

          <button class="aby-bs-close" id="aby-bs-close" type="button">✕</button>
        </header>

        <div class="aby-poster-main">
          <section class="aby-bs-section">
            <div class="aby-bs-section-title">성격 / 특징</div>
            <div class="aby-bs-taglist" id="aby-bs-traits"></div>
          </section>

          <section class="aby-bs-section">
            <div class="aby-bs-section-title">간단 소개</div>
            <div class="aby-bs-desc" id="aby-bs-desc">
              상품을 선택하면 간단한 설명이 표시됩니다.
            </div>
          </section>

          <section class="aby-bs-section">
            <div class="aby-bs-section-title">리리 코멘트</div>
            <div class="aby-bs-riri" id="aby-bs-riri">
              😈 “주인님, 상품을 선택하시면 제가 의견을 들려드릴게요.”
            </div>
          </section>
        </div>

        <footer class="aby-poster-footer">
          <div class="aby-bs-pricebox">
            <div class="aby-bs-price-label">가격</div>
            <div class="aby-bs-price-value" id="aby-bs-price">-</div>
          </div>

          <div class="aby-bs-actions">
            <button class="aby-btn aby-btn-main" data-action="buy">즉시 구매</button>
          </div>

          <button class="aby-btn aby-btn-ghost" data-action="ask-riri">
            이 노예의 더러운 비밀을 알려줘, 리리
          </button>
        </footer>
      </div>
    </div>
  </section>

  <div class="aby-itemsheet-backdrop" id="aby-itemsheet-backdrop"></div>
  <section class="aby-itemsheet" id="aby-itemsheet">
    <div class="aby-itemsheet-panel">
      <header class="aby-itemsheet-header">
        <div class="aby-itemsheet-title-wrap">
          <div class="aby-itemsheet-title" id="aby-itemsheet-title">아이템을 선택하세요</div>
          <div class="aby-itemsheet-sub" id="aby-itemsheet-sub">공통 아이템</div>
        </div>
        <button class="aby-itemsheet-close" id="aby-itemsheet-close">✕</button>
      </header>

      <div class="aby-itemsheet-body">
        <dl class="aby-itemsheet-dl">
          <div class="aby-itemsheet-row">
            <dt>효과</dt>
            <dd id="aby-itemsheet-effect">아이템의 효과가 여기 표시됩니다.</dd>
          </div>
          <div class="aby-itemsheet-row">
            <dt>용도</dt>
            <dd id="aby-itemsheet-usage">아이템을 어떻게 써먹는지 설명이 들어갑니다.</dd>
          </div>
          <div class="aby-itemsheet-row" id="aby-itemsheet-riri-row">
            <dt>리리 코멘트</dt>
            <dd id="aby-itemsheet-riri">
              “아이템을 하나 골라봐, 주인. 내가 얼마나 변태템인지 찐하게 설명해줄게.”
            </dd>
          </div>
        </dl>
      </div>

      <footer class="aby-itemsheet-footer">
        <div class="aby-itemsheet-price" id="aby-itemsheet-price">- Cr</div>

        <select id="aby-item-target" class="aby-item-target">
          <option value="">사용 대상 선택</option>
        </select>

        <button class="aby-btn aby-btn-main" id="aby-itemsheet-buy">아이템 구매</button>
      </footer>
    </div>
  </section>
</div>

<style>
:root {
  --aby-bg: #05070c;
  --aby-panel: #020617;
  --aby-panel-soft: rgba(3, 7, 18, 0.96);
  --aby-text-main: #e5e7eb;
  --aby-text-muted: #9ca3af;
  --aby-text-soft: #6b7280;
  --aby-accent-main: #f97316;
  --aby-accent-main-soft: #fed7aa;
  --aby-accent-sub: #38bdf8;
  --aby-chip-bg: rgba(15, 23, 42, 0.85);
  --aby-chip-border: rgba(148, 163, 184, 0.8);
  --aby-chip-blue: rgba(30, 64, 175, 0.85);
}

.aby-root {
  box-sizing: border-box;
  padding: 6px;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo",
    system-ui, sans-serif;
  background: var(--aby-bg);
  color: var(--aby-text-main);
  display: flex;
  flex-direction: column;
  gap: 6px;
  position: relative;
  overflow: hidden;
}

.aby-hero {
  position: relative;
  width: 100%;
  height: 120px;
  border-radius: 12px;
  overflow: hidden;
  background-image: url("https://itimg.kr/400/abyss/%ED%95%B4%EB%8D%94.png");
  background-position: center top;
  background-size: cover;
  background-repeat: no-repeat;
  box-shadow: 0 3px 10px rgba(0, 0, 0, 0.6);
}
.aby-hero-overlay {
  position: absolute;
  inset: 0;
  padding: 6px 8px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  pointer-events: none;
}
.aby-hero-row {
  display: flex;
  justify-content: flex-end;
  align-items: flex-start;
  gap: 6px;
}
.aby-rank,
.aby-credit-chip {
  display: flex;
  align-items: center;
  height: 24px;
  padding: 0 10px;
  border-radius: 999px;
  font-size: 11px;
}
.aby-rank {
  pointer-events: auto;
  font-weight: 700;
  background: rgba(0, 0, 0, 0.6);
  border: 1px solid rgba(255, 255, 255, 0.25);
}
.aby-credit-chip {
  pointer-events: auto;
  gap: 4px;
  background: rgba(0, 0, 0, 0.7);
  border: 1px solid rgba(255, 184, 96, 0.9);
}
.aby-credit-label {
  font-size: 11px;
  opacity: 0.9;
}
.aby-credit-value {
  font-size: 11px;
  font-weight: 700;
}

.aby-main-tabs {
  display: flex;
  justify-content: space-around;
  align-items: center;
  border-bottom: 1px solid rgba(31, 41, 55, 0.9);
  padding: 4px 2px 0;
}
.aby-main-tab {
  flex: 1;
  border: none;
  background: transparent;
  color: var(--aby-text-muted);
  font-size: 12px;
  padding: 6px 0 4px;
  cursor: pointer;
  position: relative;
}
.aby-main-tab.active {
  color: #ffffff;
  font-weight: 600;
}
.aby-main-tab.active::after {
  content: "";
  position: absolute;
  left: 16px;
  right: 16px;
  bottom: 0;
  height: 2px;
  border-radius: 999px;
  background: var(--aby-accent-main);
}

.aby-main {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  position: relative;
}
.aby-view {
  flex: 1;
  display: none;
  flex-direction: column;
}
.aby-view.active {
  display: flex;
}

.aby-filterbar,
.aby-item-filterbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-top: 6px;
  margin-bottom: 4px;
  flex-wrap: wrap;
}
.aby-tabs {
  flex: 1;
  display: flex;
  gap: 6px;
}
.aby-tab {
  padding: 0 10px;
  height: 26px;
  border-radius: 999px;
  border: 1px solid rgba(148, 163, 184, 0.6);
  font-size: 11px;
  white-space: nowrap;
  background: rgba(15, 23, 42, 0.95);
  color: #e5e7eb;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
}
.aby-tab.active {
  border-color: #fb923c;
  background: #fed7aa;
  color: #7c2d12;
  font-weight: 600;
}
.aby-toolbar {
  flex: 0 0 auto;
}
.aby-sort-btn {
  padding: 0 12px;
  height: 26px;
  border-radius: 999px;
  border: 1px solid rgba(148, 163, 184, 0.7);
  background: rgba(15, 23, 42, 0.95);
  color: #e5e7eb;
  font-size: 10px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
}

.aby-card-grid {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  padding: 12px 0 6px;
}
.aby-card {
  position: relative;
  flex: 0 0 calc(33.333% - 8px);
  max-width: 140px;
  height: 200px;
  box-sizing: border-box;
  border-radius: 12px;
  overflow: hidden;
  background: radial-gradient(circle at top, #111827 0, #020617 55%, #000 100%);
  cursor: pointer;
  box-shadow: 0 2px 6px rgba(15, 23, 42, 0.7);
}
.aby-card[data-rarity="5"] {
  box-shadow: 0 0 0 2px rgba(251, 191, 36, 0.9);
}
.aby-card[data-rarity="4"] {
  box-shadow: 0 0 0 2px rgba(96, 165, 250, 0.9);
}
.aby-card[data-rarity="3"] {
  box-shadow: 0 0 0 1px rgba(52, 211, 153, 0.7);
}
.aby-card-illu {
  position: absolute;
  inset: 0;
}
.aby-card-illu img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  filter: saturate(1.05) contrast(1.05);
}
.aby-card-ribbon {
  position: absolute;
  top: 6px;
  left: 6px;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 9px;
  background: linear-gradient(135deg, #fed7aa, #f97316);
  color: #3b0b0b;
  font-weight: 700;
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.7);
}
.aby-card-ribbon.empty {
  display: none;
}
.aby-card-info {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  padding: 5px 7px 7px;
  background: linear-gradient(
    to top,
    rgba(0, 0, 0, 0.92) 0%,
    rgba(0, 0, 0, 0.65) 40%,
    rgba(0, 0, 0, 0.0) 100%
  );
  color: #f9fafb;
  font-size: 9px;
}
.aby-card-name-row {
  position: relative;
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 1px;
  padding: 2px 4px 2px 2px;
}
.aby-card-name-row::before {
  content: "";
  position: absolute;
  inset: 0;
  left: -2px;
  right: -2px;
  border-radius: 6px;
  background: linear-gradient(
    90deg,
    rgba(249, 115, 22, 0.6),
    rgba(249, 115, 22, 0.0)
  );
  opacity: 0.45;
}
.aby-card-name,
.aby-card-stars {
  position: relative;
}
.aby-card-name {
  color: #f9fafb;
  font-size: 10px;
  font-weight: 700;
  max-width: 70px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  text-shadow: 0 0 4px rgba(0, 0, 0, 0.9);
}
.aby-card-stars {
  font-size: 9px;
  color: #facc15;
  text-shadow: 0 0 4px rgba(0, 0, 0, 0.8);
}
.aby-card-meta {
  margin-top: 1px;
  opacity: 0.9;
  color: #e5e7eb;
  text-shadow: 0 0 4px rgba(0, 0, 0, 0.9);
}
.aby-card-price {
  margin-top: 2px;
  font-size: 9px;
  font-weight: 700;
  color: #fb923c;
  text-shadow:
    0 0 4px rgba(0, 0, 0, 0.9),
    0 0 1px rgba(0, 0, 0, 0.9);
}

.aby-empty {
  width: 100%;
  font-size: 11px;
  text-align: center;
  color: #9ca3af;
  padding: 10px 4px;
}

.aby-pagebar {
  margin: 2px 0 6px;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  color: #e5e7eb;
}
.aby-page-btn {
  width: 28px;
  height: 18px;
  border-radius: 999px;
  border: 1px solid rgba(148, 163, 184, 0.7);
  background: rgba(15, 23, 42, 0.95);
  color: #e5e7eb;
  font-size: 10px;
  cursor: pointer;
}
.aby-page-info {
  min-width: 48px;
  text-align: center;
  font-weight: 600;
}

.aby-bottomsheet-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.7);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.18s ease-out;
  z-index: 40;
}
.aby-bottomsheet-backdrop.open {
  opacity: 1;
  pointer-events: auto;
}
.aby-bottomsheet {
  position: fixed;
  inset: 0;
  padding: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
  transform: translateY(100%);
  transition: transform 0.25s ease-out;
  z-index: 50;
}
.aby-bottomsheet.open {
  transform: translateY(0);
  pointer-events: auto;
}
.aby-poster-card {
  position: relative;
  width: 100%;
  max-width: 420px;
  height: 100%;
  max-height: 680px;
  border-radius: 18px;
  overflow: hidden;
  background: #020617;
  box-shadow: 0 12px 28px rgba(0, 0, 0, 0.9);
}
.aby-poster-bg {
  position: absolute;
  inset: 0;
  background-position: center top;
  background-size: cover;
  background-repeat: no-repeat;
  filter: saturate(1.05) contrast(1.05);
}
.aby-poster-gradient {
  position: absolute;
  inset: 0;
  background: linear-gradient(
    to top,
    rgba(3, 7, 18, 0.96) 0%,
    rgba(3, 7, 18, 0.9) 28%,
    rgba(3, 7, 18, 0.7) 45%,
    rgba(3, 7, 18, 0.4) 60%,
    rgba(3, 7, 18, 0.12) 78%,
    rgba(3, 7, 18, 0.0) 100%
  );
}
.aby-poster-content {
  position: absolute;
  inset: 0;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
}
.aby-poster-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}
.aby-bs-headerbox {
  padding: 0;
  margin: 0;
  background: transparent;
}
.aby-bs-title-row {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 2px;
}
.aby-bs-name {
  font-size: 18px;
  font-weight: 900;
  letter-spacing: 0.04em;
  color: #f97316;
  text-shadow:
    0 0 4px rgba(249, 115, 22, 1),
    0 0 10px rgba(251, 146, 60, 1),
    0 0 14px rgba(0, 0, 0, 1);
}
.aby-bs-race {
  padding: 2px 8px;
  border-radius: 999px;
  background: rgba(15, 23, 42, 0.85);
  border: 1px solid rgba(148, 163, 184, 0.8);
  font-size: 10px;
}
.aby-bs-meta-row {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  font-size: 10px;
}
.aby-bs-rarity {
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 10px;
  color: #fffbeb;
  background: rgba(24, 16, 6, 0.95);
  border: 1px solid rgba(251, 191, 36, 1);
  text-shadow:
    0 0 4px rgba(251, 191, 36, 1),
    0 0 8px rgba(245, 158, 11, 1);
}
.aby-bs-subtag {
  padding: 2px 8px;
  border-radius: 999px;
  background: rgba(30, 64, 175, 0.85);
  border: none;
  font-size: 10px;
}
.aby-bs-close {
  pointer-events: auto;
  margin-left: 8px;
  padding: 0;
  width: 26px;
  height: 26px;
  border-radius: 999px;
  border: 1px solid rgba(148, 163, 184, 0.9);
  background: rgba(15, 23, 42, 0.9);
  color: #e5e7eb;
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}
.aby-poster-main {
  margin-top: auto;
  max-height: 220px;
  padding-right: 4px;
  overflow-y: auto;
}
.aby-bs-section {
  margin-bottom: 10px;
}
.aby-bs-section-title {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  margin-bottom: 4px;
  padding-left: 6px;
  color: #7dd3fc;
  border-left: 2px solid #38bdf8;
  text-shadow:
    0 0 4px rgba(56, 189, 248, 0.9),
    0 0 10px rgba(8, 47, 73, 0.9);
}
.aby-bs-taglist {
  display: flex;
  flex-wrap: wrap;
  gap: 3px 10px;
}
.aby-bs-tagitem {
  background: transparent;
  border: none;
  padding: 0;
  font-size: 11px;
  color: #bfdbfe;
  text-shadow: 0 0 4px rgba(59, 130, 246, 0.8);
}
.aby-bs-tagitem::before {
  content: "#";
  margin-right: 2px;
  opacity: 0.9;
  font-size: 10px;
}
.aby-bs-desc,
.aby-bs-riri {
  font-size: 11px;
  line-height: 1.5;
  color: #e0f2fe;
  text-shadow:
    0 0 4px rgba(15, 23, 42, 0.9),
    0 0 8px rgba(56, 189, 248, 0.6);
}
.aby-poster-footer {
  flex-shrink: 0;
  margin-top: 4px;
  padding-top: 6px;
  border-top: 1px dashed rgba(55, 65, 81, 0.85);
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.aby-bs-pricebox {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
}
.aby-bs-price-label {
  font-size: 11px;
  color: #9ca3af;
}
.aby-bs-price-value {
  font-size: 18px;
  font-weight: 800;
  color: #f97316;
  text-shadow: 0 0 6px rgba(0, 0, 0, 0.9);
}

.aby-bs-actions {
  display: flex;
  gap: 6px;
}
.aby-btn {
  width: 100%;
  border-radius: 999px;
  border: none;
  padding: 8px 0;
  font-size: 12px;
  cursor: pointer;
}
.aby-btn-main {
  background: linear-gradient(135deg, #fb923c, #f97316);
  color: #1b0b06;
  font-weight: 700;
}
.aby-btn-ghost {

function abyStars(r) {
  const x = Math.max(1, Math.min(5, Number(r) || 1));
  return "★".repeat(x);
}
function abyFormatBC(v) {
  const n = Number(v) || 0;
  return n.toLocaleString("ko-KR") + " BC";
}
function abyFormatCr(v) {
  const n = Number(v) || 0;
  return n.toLocaleString("ko-KR") + " Cr";
}

function abyParseSlaveVar(raw, fallbackName) {
  if (!raw || typeof raw !== "string") {
    return {
      name: fallbackName || "",
      favor: null,
      obedience: null,
      corruption: null,
      mood: "",
      owned: false,
    };
  }

  const parts = raw.split("|").filter(Boolean);
  const [name, favorRaw, obedienceRaw, corruptionRaw, moodRaw, ownedRaw] = parts;

  const toNumOrNull = (v) => {
    if (v == null) return null;
    const n = parseInt(v, 10);
    return Number.isFinite(n) ? n : null;
  };

  const favor = toNumOrNull(favorRaw);
  const obedience = toNumOrNull(obedienceRaw);
  const corruption = toNumOrNull(corruptionRaw);

  const owned =
    ownedRaw === "1" ||
    ownedRaw === 1 ||
    (typeof ownedRaw === "string" && /1|구매|보유/.test(ownedRaw));

  return {
    name: name || fallbackName || "",
    favor,
    obedience,
    corruption,
    mood: moodRaw || "",
    owned,
  };
}

function abySetMode(mode) {
  abyState.mode = mode;
  document.querySelectorAll(".aby-main-tab").forEach((btn) => {
    btn.classList.toggle("active", btn.dataset.mode === mode);
  });
  document.querySelectorAll(".aby-view").forEach((v) => {
    v.classList.remove("active");
  });
  if (mode === "slave") {
    document.getElementById("aby-view-slaves").classList.add("active");
  } else if (mode === "item") {
    document.getElementById("aby-view-items").classList.add("active");
  } else {
    document.getElementById("aby-view-status").classList.add("active");
  }
}

const ABY_TABS = [
  { id: "all", label: "전체" },
  { id: "N", label: "N" },
  { id: "R", label: "R" },
  { id: "SR", label: "SR" },
  { id: "SSR", label: "SSR" },
];
function abyCategoryMatch(catId, item) {
  const r = Number(item.rarity) || 0;
  if (catId === "all") return true;
  if (catId === "N") return r <= 2;
  if (catId === "R") return r === 3;
  if (catId === "SR") return r === 4;
  if (catId === "SSR") return r >= 5;
  return true;
}
function abyGetFilteredSlaves() {
  let list = abyState.slaves.slice();
  list = list.filter((s) => abyCategoryMatch(abyState.slaveCategory, s));
  list.sort((a, b) => {
    const key = abyState.slaveSort;
    if (key === "price-asc") return a.price - b.price;
    if (key === "price-desc") return b.price - a.price;
    if (key === "name")
      return (a.name || "").localeCompare(b.name || "", "ko-KR");
    const r = b.rarity - a.rarity;
    if (r !== 0) return r;
    return b.price - a.price;
  });
  return list;
}

function abyGetCurrentItems() {
  const tab = abyState.itemTab;
  const src = tab === "personal" ? abyState.itemsPersonal : abyState.itemsCommon;
  let list = src.slice();
  list.sort((a, b) => {
    const key = abyState.itemSort;
    if (key === "price-desc") return b.price - a.price;
    if (key === "name")
      return (a.name || "").localeCompare(b.name || "", "ko-KR");
    return a.price - b.price;
  });

  if (
    tab === "personal" &&
    abyState.itemOwnerFilter &&
    abyState.itemOwnerFilter !== "all"
  ) {
    list = list.filter(
      (it) => (it.target || it.owner) === abyState.itemOwnerFilter
    );
  }
  return list;
}

  const size = abyState.slavePageSize;
  const pageCount = Math.max(1, Math.ceil(total / size));
  if (abyState.slavePageIndex >= pageCount)
    abyState.slavePageIndex = pageCount - 1;

  const start = abyState.slavePageIndex * size;
  const pageItems = list.slice(start, start + size);

  grid.innerHTML = pageItems
    .map((item) => {

        ? "aby-card-ribbon"

        ? `<div class="aby-card-illu"><img src="${item.img}" alt="${item.name}" /></div>`

      return `

function abyRefreshItemOwnerFilter() {
  const select = document.getElementById("aby-item-owner-filter");
  if (!select) return;

  if (abyState.itemTab !== "personal") {
    select.classList.add("hidden");
    return;
  } else {
    select.classList.remove("hidden");
  }

  const owners = Array.from(
    new Set(
      (abyState.itemsPersonal || [])
        .map((it) => it.target || it.owner)
        .filter(Boolean)
    )
  ).sort((a, b) => a.localeCompare(b, "ko-KR"));

  const current = abyState.itemOwnerFilter || "all";

  select.innerHTML =
    `<option value="all">캐릭터</option>` +
    owners
      .map(
        (name) =>
          `<option value="${name}" ${
            current === name ? "selected" : ""
          }>${name} 전용</option>`
      )
      .join("");
}

function abyRefreshItemTargetSelect() {
  const select = document.getElementById("aby-item-target");
  if (!select) return;

  const prevValue = select.value;

  let html = `<option value="">사용할 캐릭터 선택</option>`;

  const ownedSlaves = (abyState.slaves || []).filter((s) => s.owned);

  if (ownedSlaves.length === 0) {
    html += `<option value="" disabled>보유 중인 캐릭터 없음</option>`;
  } else {
    html += ownedSlaves
      .map((s) => `<option value="${s.name}">${s.name}</option>`)
      .join("");
  }

  select.innerHTML = html;

  if (
    prevValue &&
    Array.from(select.options).some((o) => o.value === prevValue)
  ) {
    select.value = prevValue;
  }
}

function abyInit() {
  abyState.slaves = ABY_DEFAULT_SLAVES.slice();

  document.querySelectorAll(".aby-main-tab").forEach((btn) => {
    btn.addEventListener("click", () => {
      const mode = btn.dataset.mode;
      abySetMode(mode);
    });
  });

  const tabsEl = document.getElementById("aby-tabs");
  if (tabsEl) {
    tabsEl.addEventListener("click", (e) => {
      const btn = e.target.closest(".aby-tab");
      if (!btn) return;
      abyState.slaveCategory = btn.dataset.tab;
      abyState.slavePageIndex = 0;
      abyRenderTabs();
      abyRenderCards();
    });
  }

  const sortBtn = document.getElementById("aby-sort-btn");
  if (sortBtn) {
    sortBtn.addEventListener("click", () => {
      const order = ["rarity", "price-asc", "price-desc", "name"];
      const idx = order.indexOf(abyState.slaveSort);
      const next = order[(idx + 1) % order.length];
      abyState.slaveSort = next;
      abyState.slavePageIndex = 0;
      let label = "희귀도";
      if (next === "price-asc") label = "가격 낮은순";
      else if (next === "price-desc") label = "가격 높은순";
      else if (next === "name") label = "이름순";
      sortBtn.textContent = "정렬: " + label;
      abyRenderCards();
    });
  }

  const grid = document.getElementById("aby-card-grid");
  if (grid) {
    grid.addEventListener("click", (e) => {
      const card = e.target.closest(".aby-card");
      if (!card) return;
      const id = card.dataset.id;
      abyState.selectedSlaveId = id;
      abyRenderBottomSheet();
    });
  }

  const prevBtn = document.getElementById("aby-page-prev");
  const nextBtn = document.getElementById("aby-page-next");
  if (prevBtn && nextBtn) {
    prevBtn.addEventListener("click", () => {
      if (abyState.slavePageIndex > 0) {
        abyState.slavePageIndex -= 1;
        abyRenderCards();
      }
    });
    nextBtn.addEventListener("click", () => {
      const total = abyGetFilteredSlaves().length;
      const maxPage = Math.max(
        1,
        Math.ceil(total / abyState.slavePageSize)
      );
      if (abyState.slavePageIndex < maxPage - 1) {
        abyState.slavePageIndex += 1;
        abyRenderCards();
      }
    });
  }

  const bsBackdrop = document.getElementById("aby-bottomsheet-backdrop");
  const bsSheet = document.getElementById("aby-bottomsheet");
  const bsClose = document.getElementById("aby-bs-close");
  function closeSlaveSheet() {
    if (!bsSheet || !bsBackdrop) return;
    bsSheet.classList.remove("open");
    bsBackdrop.classList.remove("open");
    abyState.selectedSlaveId = null;
  }
  if (bsBackdrop) bsBackdrop.addEventListener("click", closeSlaveSheet);
  if (bsClose) bsClose.addEventListener("click", closeSlaveSheet);
  if (bsSheet) {
    bsSheet.addEventListener("click", (e) => {
      const card = e.target.closest(".aby-poster-card");
      if (!card) {
        closeSlaveSheet();
      }
    });
  }

  if (bsSheet) {
    const buyBtn = bsSheet.querySelector('[data-action="buy"]');
    const askRiriBtn = bsSheet.querySelector('[data-action="ask-riri"]');

    if (buyBtn) {
      buyBtn.addEventListener("click", () => {
        const slave = abyState.slaves.find(
          (s) => s.id === abyState.selectedSlaveId
        );
        if (!slave) return;

        const msg = `리리야 🏷️노예 ${slave.name}|${slave.price} Cr 구매할래!`;

        try {
          if (typeof sendMessage === "function") {
            sendMessage(msg);
          }
        } catch (e) {
          console.warn("sendMessage 실패", e);
        }
      });
    }

    if (askRiriBtn) {
      askRiriBtn.addEventListener("click", () => {
        const slave = abyState.slaves.find(
          (s) => s.id === abyState.selectedSlaveId
        );
        if (!slave) return;

        const msg = `리리야 ${slave.name} 에 관해서 알려줄래?`;

        try {
          if (typeof sendMessage === "function") {
            sendMessage(msg);
          }
        } catch (e) {
          console.warn("sendMessage 실패", e);
        }
      });
    }
  }

  document.querySelectorAll(".aby-item-tab").forEach((btn) => {
    btn.addEventListener("click", () => {
      const tab = btn.dataset.itab;
      abyState.itemTab = tab;
      abyState.itemPageIndex = 0;
      document.querySelectorAll(".aby-item-tab").forEach((b) =>
        b.classList.toggle("active", b.dataset.itab === tab)
      );
      abyRefreshItemOwnerFilter();
      abyRenderItems();
    });
  });

  const ownerSelect = document.getElementById("aby-item-owner-filter");
  if (ownerSelect) {
    ownerSelect.addEventListener("change", () => {
      abyState.itemOwnerFilter = ownerSelect.value || "all";
      abyState.itemPageIndex = 0;
      abyRenderItems();
    });
  }

  const itemSortBtn = document.getElementById("aby-item-sort-btn");
  if (itemSortBtn) {
    itemSortBtn.addEventListener("click", () => {
      const order = ["price-asc", "price-desc", "name"];
      const idx = order.indexOf(abyState.itemSort);
      const next = order[(idx + 1) % order.length];
      abyState.itemSort = next;
      abyState.itemPageIndex = 0;
      let label = "가격 낮은순";
      if (next === "price-desc") label = "가격 높은순";
      else if (next === "name") label = "이름순";
      itemSortBtn.textContent = "정렬: " + label;
      abyRenderItems();
    });
  }

  const itemGrid = document.getElementById("aby-item-grid");
  if (itemGrid) {
    itemGrid.addEventListener("click", (e) => {
      const card = e.target.closest(".aby-item-card");
      if (!card) return;
      const id = card.dataset.id;
      abyState.selectedItemId = id;
      abyRenderItemSheet();
    });
  }

  const itemPrev = document.getElementById("aby-item-page-prev");
  const itemNext = document.getElementById("aby-item-page-next");
  if (itemPrev && itemNext) {
    itemPrev.addEventListener("click", () => {
      if (abyState.itemPageIndex > 0) {
        abyState.itemPageIndex -= 1;
        abyRenderItems();
      }
    });
    itemNext.addEventListener("click", () => {
      const total = abyGetCurrentItems().length;
      const maxPage = Math.max(
        1,
        Math.ceil(total / abyState.itemPageSize)
      );
      if (abyState.itemPageIndex < maxPage - 1) {
        abyState.itemPageIndex += 1;
        abyRenderItems();
      }
    });
  }

  const isBackdrop = document.getElementById("aby-itemsheet-backdrop");
  const isSheet = document.getElementById("aby-itemsheet");
  const isClose = document.getElementById("aby-itemsheet-close");
  function closeItemSheet() {
    if (!isSheet || !isBackdrop) return;
    isSheet.classList.remove("open");
    isBackdrop.classList.remove("open");
    abyState.selectedItemId = null;
  }
  if (isBackdrop) isBackdrop.addEventListener("click", closeItemSheet);
  if (isClose) isClose.addEventListener("click", closeItemSheet);
  if (isSheet) {
    isSheet.addEventListener("click", (e) => {
      const panel = e.target.closest(".aby-itemsheet-panel");
      if (!panel) closeItemSheet();
    });
  }

  const itemBuyBtn = document.getElementById("aby-itemsheet-buy");
  if (itemBuyBtn) {
    itemBuyBtn.addEventListener("click", () => {
      const list = abyGetCurrentItems();
      const item = list.find((it) => it.id === abyState.selectedItemId);
      if (!item) return;

      const targetSelect = document.getElementById("aby-item-target");
      const targetName = targetSelect ? targetSelect.value : "";

      if (!targetName) {
        alert("어느 캐릭터에게 사용할지 선택해 주세요.");
        return;
      }

      const msg = `리리야 🔮아이템 [${item.name}]|[${item.price} Cr] 구매해서 ${targetName}에게 사용하고싶어`;

      try {
        if (typeof sendMessage === "function") {
          sendMessage(msg);
        }
      } catch (e) {
        console.warn("sendMessage 실패", e);
      }
    });
  }

  abyRefreshItemOwnerFilter();

  abyRenderAll();
  abySetMode("slave");
}

document.addEventListener("DOMContentLoaded", abyInit);

function onUpdateData(statusViewData) {
  if (!statusViewData || typeof statusViewData.getObject !== "function")
    return;

  const all = statusViewData.getObject() || {};

  let credit =
    all.var_credits ??
    all.var_Credits ??
    all.credits ??
    all.credit ??
    all["크레딧"];
  if (credit == null) credit = 0;
  abyState.credit = Number(credit) || 0;

  const rank =
    all.var_rank ||
    all.var_Rank ||
    all.rank ||
    all["등급"] ||
    all["AbyssRank"] ||
    all["abyss_rank"] ||
    null;
  if (rank != null) abyState.rankText = String(rank);

  const timeVal =
    all.var_time ??
    all.var_Time ??
    all.time;

  if (timeVal != null) {
    abyState.meta.time = String(timeVal);
  }

  const locVal =
    all.var_location ??
    all.var_Location ??
    all.location;

  if (locVal != null) {
    abyState.meta.location = String(locVal);
  }

  let slaves = all.market_slaves || all["노예 목록"] || null;
  if (typeof slaves === "string") {
    try {
      slaves = JSON.parse(slaves);
    } catch (e) {
      slaves = null;
    }
  }

  if (Array.isArray(slaves) && slaves.length > 0) {
    abyState.slaves = slaves.map((s, i) => ({
      ...ABY_DEFAULT_SLAVES[0],
      ...s,
      id: s.id || `slave-${i}`,
    }));
  }

  if (Array.isArray(abyState.slaves)) {
    abyState.slaves = abyState.slaves.map((s) => {
      const name = String(s.name || "");
      const baseName = name.replace(/\s+/g, "");

      const candidates = [
        "var_" + baseName,
        baseName,
        name,
      ];

      let raw = null;
      for (const k of candidates) {
        if (k && all[k] != null) {
          raw = all[k];
          break;
        }
      }

      if (!raw || typeof raw !== "string") {
        return { ...s };
      }

      const parsed = abyParseSlaveVar(raw, name);

      return {
        ...s,
        owned: parsed.owned,
        favor: parsed.favor,
        obedience: parsed.obedience,
        corruption: parsed.corruption,
        mood: parsed.mood,
      };
    });
  }

  abyRenderHero();
  abyRenderTabs();
  abyRenderCards();
  abyRenderItems();

  if (typeof abyRenderStatus === "function") {
    abyRenderStatus();
  }
}
</script>
